openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
  description: The openapi-fn sample API. Schemas live in a second document.
servers:
  - url: http://localhost:8080/api
tags:
  - name: pets
    description: Everything about pets
paths:
  /pets:
    get:
      tags: [pets]
      operationId: listPets
      summary: Lists pets, optionally of one kind
      parameters:
        - name: kind
          in: query
          schema: {$ref: 'schemas.yaml#/Kind'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: The pets
          headers:
            X-Total-Count:
              required: true
              schema: {type: integer, minimum: 0}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: 'schemas.yaml#/Pet'}
    post:
      tags: [pets]
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: 'schemas.yaml#/NewPet'}
      responses:
        '201':
          description: Created
          headers:
            Location:
              required: true
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: 'schemas.yaml#/Pet'}
        '409':
          $ref: '#/components/responses/Problem'
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags: [pets]
      operationId: getPet
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema: {$ref: 'schemas.yaml#/Pet'}
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [pets]
      operationId: deletePet
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: A problem
      content:
        application/problem+json:
          schema: {$ref: 'schemas.yaml#/Problem'}
