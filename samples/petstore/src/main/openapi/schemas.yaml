Kind:
  type: string
  enum: [cat, dog]
NewPet:
  type: object
  required: [name, kind]
  properties:
    name: {type: string, minLength: 1, maxLength: 50}
    kind: {$ref: '#/Kind'}
    tags:
      type: array
      uniqueItems: true
      items: {type: string}
Pet:
  oneOf:
    - $ref: '#/Cat'
    - $ref: '#/Dog'
  discriminator:
    propertyName: kind
    mapping:
      cat: '#/Cat'
      dog: '#/Dog'
# The discriminator does not decide validation (OpenAPI: it MUST NOT change the outcome), so each
# kind of pet only accepts its own kind: a cat is not also a valid dog.
Cat:
  allOf:
    - $ref: '#/NewPet'
    - type: object
      required: [id]
      properties:
        kind: {enum: [cat]}
        id: {type: integer, format: int64}
        indoor: {type: boolean, default: true}
Dog:
  allOf:
    - $ref: '#/NewPet'
    - type: object
      required: [id]
      properties:
        kind: {enum: [dog]}
        id: {type: integer, format: int64}
        goodBoy: {type: boolean}
Problem:
  type: object
  required: [title, status]
  properties:
    type: {type: string, format: uri-reference}
    title: {type: string}
    status: {type: integer}
    detail: {type: string}
