[versions]
spring-boot = "4.1.1"
snakeyaml-engine = "3.2"
# The version Spring Boot 4.1.1 manages.
jackson = "3.1.5"
junit = "6.0.3"
assertj = "3.27.7"
mockito = "5.23.0"
jacoco = "0.8.15"
# Only to compare request and response validation with (see AtlassianDifferentialTest).
atlassian-validator = "3.0.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
atlassian-validator = { module = "com.atlassian.oai:openapi-request-validator-core", version.ref = "atlassian-validator" }
