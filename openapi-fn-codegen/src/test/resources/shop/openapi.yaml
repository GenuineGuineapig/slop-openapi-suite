openapi: 3.2.0
info: {title: Shop, version: 1.0.0, description: A feature-rich fixture for code generation}
servers:
  - url: https://{region}.shop.example.com/api/v1
    variables:
      region: {default: eu, enum: [eu, us]}
security:
  - apiKey: []
tags:
  - name: pets
  - name: orders
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List pets
      parameters:
        - {name: limit, in: query, schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}}
        - {name: tags, in: query, explode: false, schema: {type: array, items: {type: string}}}
        - {name: filter, in: query, style: deepObject, schema: {type: object, properties: {kind: {$ref: 'schemas/pets.yaml#/Kind'}, minAge: {type: integer}}}}
        - {name: X-Request-Id, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: session, in: cookie, schema: {type: string}}
      responses:
        '200':
          description: The pets
          headers:
            X-Total: {required: true, schema: {type: integer, format: int64}}
            X-Next: {schema: {type: string, format: uri}}
          content:
            application/json:
              schema: {type: array, items: {$ref: 'schemas/pets.yaml#/Pet'}}
            application/xml:
              schema: {type: array, xml: {name: pets, wrapped: true}, items: {$ref: 'schemas/pets.yaml#/Pet'}}
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: 'schemas/pets.yaml#/Pet'}}
          application/x-www-form-urlencoded: {schema: {$ref: 'schemas/pets.yaml#/Pet'}}
      responses:
        '201':
          description: Created
          headers:
            Location: {required: true, schema: {type: string}}
          content:
            application/json: {schema: {$ref: 'schemas/pets.yaml#/Pet'}}
        4XX:
          $ref: '#/components/responses/Problem'
      callbacks:
        petCreated:
          '{$request.header.X-Callback-Url}':
            post:
              operationId: petCreatedCallback
              requestBody:
                required: true
                content:
                  application/json: {schema: {$ref: 'schemas/pets.yaml#/Pet'}}
              responses:
                '204': {description: received}
            put:
              requestBody:
                content:
                  text/plain: {schema: {type: string}}
              responses:
                '200':
                  description: acknowledged
                  content:
                    text/plain: {schema: {type: string}}
    query:
      operationId: searchPets
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {text: {type: string}}, required: [text]}
      responses:
        '200':
          description: Matches
          content:
            application/json: {schema: {type: array, items: {$ref: 'schemas/pets.yaml#/Pet'}}}
  /pets/{petId}:
    parameters:
      - {name: petId, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      operationId: getPet
      tags: [pets]
      responses:
        '200':
          description: The pet
          content:
            application/json: {schema: {$ref: 'schemas/pets.yaml#/Pet'}}
            text/plain: {schema: {type: string}}
        '404': {description: Not found}
    delete:
      operationId: deletePet
      tags: [pets]
      deprecated: true
      responses:
        '204': {description: Deleted}
  /pets/{petId}/photo:
    put:
      operationId: uploadPhoto
      tags: [pets]
      parameters:
        - {name: petId, in: path, required: true, style: label, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                caption: {type: string}
                meta: {type: object, properties: {width: {type: integer}}}
      responses:
        '200':
          description: The stored photo
          content:
            image/png: {schema: {type: string, format: binary}}
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - {name: orderId, in: path, required: true, style: matrix, schema: {type: string, format: uuid}}
        - {name: expand, in: query, style: pipeDelimited, schema: {type: array, items: {type: string, enum: [items, customer]}}}
      responses:
        2XX:
          description: The order
          content:
            application/json: {schema: {$ref: '#/components/schemas/Order'}}
  /orders/events:
    get:
      operationId: orderEvents
      tags: [orders]
      security: []
      responses:
        '200':
          description: Events
          content:
            application/jsonl:
              itemSchema: {$ref: '#/components/schemas/OrderEvent'}
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain: {schema: {type: string}}
webhooks:
  petAdopted:
    post:
      operationId: petAdopted
      summary: A pet found a home
      parameters:
        - {name: X-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: 'schemas/pets.yaml#/Pet'}}
      responses:
        '202': {description: accepted}
  stockLow:
    post:
      requestBody:
        content:
          application/json:
            schema: {type: object, required: [sku], properties: {sku: {type: string}}}
      responses:
        '204': {description: noted}
components:
  schemas:
    Order:
      type: object
      required: [id, status, lines, total]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        status: {$ref: '#/components/schemas/OrderStatus'}
        priority: {$ref: '#/components/schemas/Priority'}
        lines:
          type: array
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: {type: string}
              quantity: {type: integer, minimum: 1}
        total: {type: number}
        discount: {type: [number, 'null']}
        createdAt: {type: string, format: date-time}
        deliveryDate: {type: string, format: date}
        notes: {type: string, maxLength: 200, nullable: true}
        attributes: {type: object, additionalProperties: {type: string}}
        tags: {type: array, uniqueItems: true, items: {type: string}}
        payment: {$ref: '#/components/schemas/Payment'}
        shipping: {$ref: '#/components/schemas/Shipping'}
        signature: {type: string, format: byte}
        website: {type: string, format: uri}
        weight: {type: number, format: double}
        ratio: {type: number, format: float}
        count: {type: integer, format: int64}
        class: {type: string, default: standard}
    OrderStatus: {type: string, enum: [placed, paid, shipped, delivered, 3-day]}
    Priority: {type: integer, enum: [1, 2, 3], default: 2}
    Payment:
      oneOf: [{$ref: '#/components/schemas/Card'}, {$ref: '#/components/schemas/Transfer'}]
      discriminator: {propertyName: method, mapping: {card: '#/components/schemas/Card', transfer: '#/components/schemas/Transfer'}}
    Card:
      type: object
      required: [method, last4]
      properties: {method: {type: string}, last4: {type: string, pattern: '^[0-9]{4}$', example: '4242'}}
    Transfer:
      type: object
      required: [method, iban]
      properties: {method: {type: string}, iban: {type: string}}
    Shipping:
      anyOf:
        - {$ref: '#/components/schemas/Address'}
        - {type: string}
    Address:
      type: object
      required: [street, city]
      additionalProperties: true
      properties: {street: {type: string}, city: {type: string}}
    OrderEvent:
      type: object
      required: [type, orderId]
      properties: {type: {type: string}, orderId: {type: string, format: uuid}}
    Problem:
      type: object
      required: [title, status]
      properties: {title: {type: string}, status: {type: integer}, detail: {type: string}}
  responses:
    Problem:
      description: A problem
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
  securitySchemes:
    apiKey: {type: apiKey, name: X-Api-Key, in: header}
