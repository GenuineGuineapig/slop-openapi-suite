Pet:
  type: object
  required: [name, kind]
  discriminator:
    propertyName: kind
    mapping:
      cat: '#/Cat'
      dog: '#/Dog'
  properties:
    id: {type: integer, format: int64, readOnly: true}
    name: {type: string, minLength: 1}
    kind: {$ref: '#/Kind'}
    birthday: {type: string, format: date}
    owner:
      type: object
      properties:
        name: {type: string}
        email: {type: string, format: email}
Kind: {type: string, enum: [cat, dog, bird]}
Cat:
  allOf:
    - $ref: '#/Pet'
    - type: object
      properties:
        indoor: {type: boolean, default: true}
Dog:
  allOf:
    - $ref: '#/Pet'
    - type: object
      required: [barks]
      properties:
        barks: {type: boolean}
